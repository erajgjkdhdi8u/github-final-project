name: Git CLI final project evidence

on:
  push:
    paths:
      - '.github/workflows/git-cli-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce merge and record Git output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Git and GitHub Student"
          git config user.email "git-cli-lab@example.invalid"
          git fetch origin
          git branch -f bug-fix-typo origin/bug-fix-typo
          git branch -f bug-fix-revert origin/bug-fix-revert
          git checkout -B main c54fe42f97c28b59b880252a5950c09a3ed5b407
          git config merge.ff false
          {
            echo '$ git checkout main'
            git checkout main
            echo '$ git merge bug-fix-typo'
            git merge bug-fix-typo
          } > merge_branches 2>&1
          {
            echo '$ git branch -avv'
            git branch -avv
          } > github-branches 2>&1
          echo '--- merge_branches ---'
          cat merge_branches
          echo '--- github-branches ---'
          cat github-branches
      - name: Upload genuine Git CLI output
        uses: actions/upload-artifact@v4
        with:
          name: git-cli-final-evidence
          path: |
            merge_branches
            github-branches
